# Quick score checks on match days (addendum A10): full-time scores from
# football-data.org every 15 minutes, so saved tickets settle soon after the
# final whistle instead of waiting a day or more for the results file. The
# full import (import.yml) still runs twice a day and the results file
# replaces these scores when it arrives.
#
# With no game awaiting a result the check makes no API request and exits at
# once. It writes straight to the database, so the sleeping API doesn't matter.
# GitHub may start scheduled runs late, so expect results within 15–30 minutes.
#
# Uses the same secrets as import.yml.

name: Scores

on:
  schedule:
    # Saturdays and Sundays, 11:00–23:45 UTC (13:00–01:45 in Malawi).
    - cron: '*/15 11-23 * * 0,6'
    # Monday to Friday evenings, 17:00–23:45 UTC: midweek and Friday games.
    - cron: '*/15 17-23 * * 1-5'
  workflow_dispatch:

# One check at a time; a check that finds another running simply waits.
# Separate from the import's group, so a check never displaces a queued import.
concurrency:
  group: scores
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scores:
    name: Check full-time scores
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find the released image
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_DB: ${{ secrets.TD_DATABASE_URL != '' }}
        run: |
          if [ "$HAS_DB" != "true" ]; then
            echo "::notice::TD_DATABASE_URL isn't set yet (see Docs/DEPLOY.md); nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "Using release $tag"
          echo "image=ghcr.io/late-night-crew/ticket-doctor-api:$tag" >> "$GITHUB_OUTPUT"

      - name: Check scores
        if: steps.release.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TD_DATABASE_URL: ${{ secrets.TD_DATABASE_URL }}
          TD_FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.TD_FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          # An older release has no scores command: skip until the next release.
          if ! docker run --rm "$IMAGE" /app/ticketdoctor --help | grep -qE '^  scores '; then
            echo "::notice::This release has no scores command yet; skipping."
            exit 0
          fi
          docker run --rm -e TD_DATABASE_URL -e TD_FOOTBALL_DATA_ORG_TOKEN "$IMAGE" /app/ticketdoctor scores
