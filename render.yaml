# Render Blueprint: everything Ticket Doctor runs on, in one file.
# See Docs/DEPLOY.md for the one-time setup and RELEASING.md for releases.
#
#   browser ──► ticket-doctor (static site, CDN)
#                 ├─ /api/* ──rewrite──► ticket-doctor-api (Go, image from ghcr.io)
#                 └─ /*  ──► the React app             │
#                                                      ▼
#                                         ticket-doctor-db (Postgres)
#
# The browser only ever talks to the static site's address, so the API needs no
# CORS for it, and the Content-Security-Policy can be 'self' throughout.
#
# Releases, not this file, decide what's deployed: the Release workflow deploys
# each version tag (API image and frontend commit) through Render's API. The
# image tag below is only the first deploy. Turn the Blueprint's auto-sync off
# (Docs/DEPLOY.md) so editing this file never redeploys an old version.

databases:
  - name: ticket-doctor-db
    # Free: 1 GB, expires 30 days after creation (14 more days to upgrade
    # before it's deleted). Export the ticket log before then: Docs/DEPLOY.md.
    plan: free
    region: frankfurt # closest Render region to Malawi; the API is next to it
    postgresMajorVersion: '17'
    databaseName: ticketdoctor
    user: ticketdoctor

services:
  - type: web
    name: ticket-doctor-api
    runtime: image
    image:
      url: ghcr.io/late-night-crew/ticket-doctor-api:v0.4.0
    plan: free # sleeps after 15 minutes idle; the first request then takes about a minute
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      # The image already sets TD_ENVIRONMENT=PRODUCTION, TD_HOST and JSON logs.
      - key: TD_DATABASE_URL
        fromDatabase:
          name: ticket-doctor-db
          property: connectionString # private network address, inside Render
      # The static site's address. Requests arrive through its /api rewrite, so
      # this only matters for anyone calling the API from another origin.
      - key: TD_ALLOWED_ORIGINS
        value: https://ticket-doctor.onrender.com
      # Only Render's proxies can reach the container, so trust X-Forwarded-For
      # from any of them: the per-IP rate limit then sees the visitor's address.
      - key: TD_TRUSTED_PROXIES
        value: 0.0.0.0/0,::/0
      # Signs admin sessions (B6). Render makes a random value once; changing
      # it signs every admin out. Without it, admin sign-in is off.
      - key: TD_ADMIN_SESSION_SECRET
        generateValue: true

  - type: web
    name: ticket-doctor
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Only releases deploy (by commit, from the Release workflow).
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_USE_MOCKS
        value: 'false'
      # Empty: the app calls /api on its own address (rewritten below).
      - key: VITE_API_URL
        value: ''
    routes:
      # First match wins, and files that exist (index.html, /assets/...) are
      # served before any rule.
      - type: rewrite
        source: /api/*
        destination: https://ticket-doctor-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
