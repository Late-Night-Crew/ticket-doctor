# sqlc turns the SQL in query.sql into typed Go functions in database/dbsqlc.
# Regenerate after changing queries or migrations: task sqlc
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: query.sql
    gen:
      go:
        package: dbsqlc
        out: database/dbsqlc
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        overrides:
          # Plain Go types instead of pgtype wrappers where the column is NOT NULL...
          - db_type: timestamptz
            go_type: time.Time
          # ...and pointers where it can be NULL.
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: pg_catalog.int2
            nullable: true
            go_type:
              type: int16
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
