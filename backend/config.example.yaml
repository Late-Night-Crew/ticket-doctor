# Copy to config.yaml for local development (config.yaml is not committed).
# config.yaml is optional: every setting has a default, and environment variables
# override the file. Put secrets in environment variables, not here:
#   TD_DATABASE_PASSWORD  password for the database fields below
#   TD_DATABASE_URL       full connection string (Supabase); overrides the fields
#   TD_ENVIRONMENT      overrides "environment"
#   PORT / TD_PORT      listen port (Render sets PORT)

# DEVELOPMENT or PRODUCTION. PRODUCTION refuses to start without a database URL
# and an explicit list of allowed origins.
environment: DEVELOPMENT

server:
  host: 127.0.0.1        # 0.0.0.0 inside a container
  port: 8080
  # Frontend origins allowed to call the API from a browser (CORS).
  allowed_origins:
    - http://localhost:5173
  # Reverse proxies in front of the API (IPs or CIDR ranges). On Render: ["10.0.0.0/8"].
  trusted_proxies: []

database:
  # Local Postgres, same style as the School Management System config.
  # Create the database once: psql -U postgres -c "CREATE DATABASE ticketdoctor"
  host: localhost
  port: 5432
  username: "postgres"
  password: ""          # your local password, or TD_DATABASE_PASSWORD
  name: "ticketdoctor"
  sslmode: disable      # require for a remote database
  max_conns: 5

  # Supabase (B5): set TD_DATABASE_URL instead of the fields above; it wins.
  # Use the *session pooler* connection string (port 5432 on the pooler host).
  # The direct host is IPv6-only on the free plan, and the transaction pooler
  # (port 6543) does not support the prepared statements pgx uses.
  # url: ""

  # No local Postgres? "task db:up" starts one in Docker on port 55432:
  #   host: 127.0.0.1, port: 55432, username/password/name: ticketdoctor

logging:
  level: info            # debug | info | warn | error
  format: text           # text (readable) | json (log collectors)
