# Copy to config.yaml for local development (config.yaml is not committed).
# config.yaml is optional: every setting has a default, and environment variables
# override the file. Put secrets in environment variables, not here:
#   TD_DATABASE_URL     Postgres connection string (contains the password)
#   TD_ENVIRONMENT      overrides "environment"
#   PORT / TD_PORT      listen port (Render sets PORT)

# DEVELOPMENT or PRODUCTION. PRODUCTION refuses to start without a database URL
# and an explicit list of allowed origins.
environment: DEVELOPMENT

server:
  host: 127.0.0.1        # 0.0.0.0 inside a container
  port: 8080
  # Frontend origins allowed to call the API from a browser (CORS).
  allowed_origins:
    - http://localhost:5173
  # Reverse proxies in front of the API (IPs or CIDR ranges). On Render: ["10.0.0.0/8"].
  trusted_proxies: []

database:
  # Local: the docker-compose database (task db:up).
  # Supabase: use the *session pooler* connection string (port 5432 on the pooler
  # host). The direct host is IPv6-only on the free plan, and the transaction pooler
  # (port 6543) does not support the prepared statements pgx uses.
  url: "postgres://ticketdoctor:ticketdoctor@127.0.0.1:55432/ticketdoctor?sslmode=disable"
  max_conns: 5

logging:
  level: info            # debug | info | warn | error
  format: text           # text (readable) | json (log collectors)
