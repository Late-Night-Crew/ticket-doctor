# Copy to config.yaml for local development (config.yaml is not committed).
# config.yaml is optional: every setting has a default, and environment variables
# override the file. Put secrets in environment variables, not here:
#   TD_DATABASE_PASSWORD  password for the database fields below
#   TD_DATABASE_URL       full connection string (Render); overrides the fields
#   TD_ENVIRONMENT      overrides "environment"
#   PORT / TD_PORT      listen port (Render sets PORT)

# DEVELOPMENT or PRODUCTION. PRODUCTION refuses to start without a database URL
# and an explicit list of allowed origins.
environment: DEVELOPMENT

server:
  host: 127.0.0.1        # 0.0.0.0 inside a container
  port: 8080
  # Frontend origins allowed to call the API from a browser (CORS).
  allowed_origins:
    - http://localhost:5173
  # Reverse proxies in front of the API (IPs or CIDR ranges). On Render: ["10.0.0.0/8"].
  trusted_proxies: []

database:
  # Local Postgres, same style as the School Management System config.
  # Create the database once: psql -U postgres -c "CREATE DATABASE ticketdoctor"
  host: localhost
  port: 5432
  username: "postgres"
  password: ""          # your local password, or TD_DATABASE_PASSWORD
  name: "ticketdoctor"
  sslmode: disable      # require for a remote database
  max_conns: 5

  # A hosted database (Render in production, see Docs/DEPLOY.md): set
  # TD_DATABASE_URL instead of the fields above; it wins. To run the import
  # from your machine against Render, use the database's *External* URL.
  # url: ""

  # No local Postgres? "task db:up" starts one in Docker on port 55432:
  #   host: 127.0.0.1, port: 55432, username/password/name: ticketdoctor

logging:
  level: info            # debug | info | warn | error
  format: text           # text (readable) | json (log collectors)

# Rule thresholds (SRS section 4, NFR-6). These are the SRS defaults; leave this
# section out to use them. Changing a value changes every estimate, risk band and
# suggestion, so change one at a time and note why. Invalid combinations stop the
# server from starting.
rules:
  form_window: 10            # recent home/away matches per profile (FR-2.1)
  low_confidence_below: 5    # fewer matches = "limited data", one band riskier (FR-2.3)
  low_from: 0.65             # Low risk from 65% (4.2)
  medium_from: 0.45          # Medium risk from 45%; below is High
  swap_min_gain: 0.10        # a swap must be 10 points better (4.3)
  max_suggestions: 2         # swaps offered per leg
  value_margin: 0.05         # "value" when the estimate beats implied odds by 5 points (4.5)
  bold_floor: 0.35           # the wizard never picks below 35% (4.6)
  max_estimate: 0.95         # no estimate is shown above 95%: a perfect record isn't a certainty

# Upcoming fixtures from football-data.org (decision D4, FR-1.2). Get a free API
# key at football-data.org. It's a secret: put it in your own config.yaml (not
# committed) or the TD_FOOTBALL_DATA_ORG_TOKEN environment variable, never here.
# Without a key, development imports results only and PRODUCTION refuses to run.
football_data_org:
  token: ""
  days_ahead: 14             # covers today, this weekend and next weekend (1-31)

# Admin sign-in (B6). Accounts are made with `ticketdoctor admin create`, not here.
# session_secret signs sessions: it's a secret, so set TD_ADMIN_SESSION_SECRET
# (at least 32 characters, e.g. `openssl rand -base64 48`) rather than writing it
# here. Left empty, development makes a random one each start (you sign in again
# after a restart) and PRODUCTION turns admin sign-in off.
admin:
  session_secret: ""
  session_hours: 12          # how long a sign-in lasts (1-168)
